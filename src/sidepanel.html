<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Brain food 笔记</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="sidepanel">
    <main class="sidepanel-wrap">
      <header class="sidepanel-head">
        <div>
          <span class="mark">Brain food notes</span>
          <p class="sidepanel-kicker">想到什么就写什么，读完后自动整理</p>
        </div>
        <span class="save-state" id="save-state">未加载</span>
      </header>

      <section class="sidepanel-card" id="empty-state" hidden>
        <h1>还没有保存这篇文章</h1>
        <p>先保存当前页面，之后就可以在这里记录想法。</p>
        <button class="btn-primary" id="save-current">保存当前文章</button>
      </section>

      <section id="notes-state" hidden>
        <div class="sidepanel-source">
          <div class="sidepanel-label">当前文章</div>
          <div class="sidepanel-title" id="article-title"></div>
          <div class="sidepanel-url" id="article-url"></div>
        </div>

        <label class="sidepanel-field">
          <span>边读边记</span>
          <textarea id="raw-notes" rows="15" placeholder="把想到的内容全部写在这里，不需要区分想法、摘录、疑问或行动。Brain food 会在阅读结束后自动整理。"></textarea>
        </label>

        <p class="sidepanel-auto-summary" id="auto-summary">正在自动识别文章类型和笔记结构…</p>
        <p class="sidepanel-hint">内容会自动保存到本地。你只负责记录，文章类型、重点、疑问和行动会在回顾时自动整理到同一篇飞书文档。</p>
      </section>
    </main>
    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
